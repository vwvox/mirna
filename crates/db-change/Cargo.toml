[package]
name = "db-change"
version = "0.1.0"
edition = "2024"

[dependencies]
anlg-cloudsync = { workspace = true }

libsqlite3-sys = "0.35"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
