<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mirna</title>
    <script src="/theme-boot.js"></script>
    <style>
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      html[data-rounded-window] #boot-splash,
      html[data-rounded-window] #root {
        clip-path: inset(0 round 10px);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(48 38% 97%);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: hsl(140 8% 11%);
      }
      .boot-splash-mark {
        position: relative;
        width: 6rem;
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-mark path {
        fill: none;
        stroke: #a9b8a3;
        stroke-width: 3px;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      .boot-splash-mark path.terra {
        stroke: #b4532f;
      }
      html.dark .boot-splash-mark path.terra {
        stroke: #e9a285;
      }
      .boot-splash-base {
        opacity: 0.3;
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: hsl(140 6% 40%);
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: hsl(100 8% 62%);
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <div class="boot-splash-base">
            <svg viewBox="0 0 250 16" aria-hidden="true">
            <path d="M4 8 C 30 3, 52 13, 82 8" />
            <path class="terra" d="M96 8 C 112 5, 128 11, 148 8" />
            <path d="M162 8 C 190 3, 214 13, 246 8" />
          </svg>
          </div>
          <div class="boot-splash-highlight">
            <svg viewBox="0 0 250 16" aria-hidden="true">
            <path d="M4 8 C 30 3, 52 13, 82 8" />
            <path class="terra" d="M96 8 C 112 5, 128 11, 148 8" />
            <path d="M162 8 C 190 3, 214 13, 246 8" />
          </svg>
          </div>
        </div>
        <p class="boot-splash-detail">
          Mirna is taking longer than usual to open.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
