# Builds Mirna for Apple Silicon Macs.
#
# - Push a tag like v0.1.0-beta.1: builds, signs and publishes a GitHub Release
#   with Mirna-mac-arm64.dmg attached. The download link
#   https://github.com/vwvox/mirna/releases/latest/download/Mirna-mac-arm64.dmg
#   always points at the newest release.
# - Run it by hand (Actions > Release macOS > Run workflow): builds only and
#   keeps the dmg as a workflow artifact for a few days, to test a build.
#
# Signing: macOS keeps microphone, system-audio and keychain access per signing
# identity, so every release must be signed with the same certificate.
# Until Mirna has an Apple Developer ID, that's the "Mirna Development"
# certificate, stored in two repository secrets:
#   MACOS_CERTIFICATE           base64 of the exported .p12
#   MACOS_CERTIFICATE_PASSWORD  the password chosen when exporting it
# Releases refuse to build without them. Hand-run test builds fall back to an
# ad hoc signature.

name: Release macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  SIGNING_IDENTITY: Mirna Development

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            version="0.0.0-test.${GITHUB_RUN_NUMBER}"
            release=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-beta.1 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Mirna $version (release: $release)"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version
          cmake --version | head -1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Import the signing certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IS_RELEASE: ${{ steps.version.outputs.release }}
        run: |
          if [[ -z "$CERT_B64" || -z "$CERT_PASSWORD" ]]; then
            if [[ "$IS_RELEASE" == "true" ]]; then
              echo "::error::Releases must be signed. Add the MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD secrets."
              exit 1
            fi
            echo "::warning::No signing certificate; this test build is signed ad hoc."
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/cert.p12"
          echo "$CERT_B64" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # A self-signed certificate has to be trusted for code signing on
          # this machine before codesign will use it.
          security find-certificate -c "$SIGNING_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$cert"

          security find-identity -v -p codesigning "$keychain"

      - name: Build Mirna
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          config=$(jq -nc --arg v "$VERSION" --arg id "$SIGNING_IDENTITY" '{
            version: $v,
            bundle: {
              createUpdaterArtifacts: false,
              macOS: { signingIdentity: $id, hardenedRuntime: false }
            }
          }')
          pnpm -F @anlg/desktop tauri build --bundles app,dmg --config "$config"

      - name: Check and package the dmg
        id: dmg
        run: |
          bundle="target/release/bundle"
          app="$bundle/macos/Mirna.app"
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)

          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E "Authority|Identifier|Signature" || true
          defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString

          mkdir -p dist
          cp "$dmg" dist/Mirna-mac-arm64.dmg
          (cd dist && shasum -a 256 Mirna-mac-arm64.dmg > Mirna-mac-arm64.dmg.sha256)
          ls -lh dist
          df -h . | tail -1

      - name: Keep the test build
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mirna-mac-arm64-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 7

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          title="Mirna $VERSION"
          cat > notes.md <<EOF
          An early build of Mirna for Macs with Apple Silicon (M1 or newer), macOS 15 or later.

          ## Install
          1. Download **Mirna-mac-arm64.dmg** below, open it and drag Mirna into Applications.
          2. The first time, macOS says it can't check Mirna for malicious software, because Mirna isn't signed by an Apple-registered developer yet. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**. Do this again after installing a newer version; your microphone and audio permissions carry over.

          ## Good to know
          - It's a beta: expect rough edges, and please report problems in Issues.
          - Notes need a local model server such as [Ollama](https://ollama.com) or LM Studio, or Apple Intelligence.
          - Check the download: \`shasum -a 256 Mirna-mac-arm64.dmg\` should match the .sha256 file.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            dist/Mirna-mac-arm64.dmg dist/Mirna-mac-arm64.dmg.sha256 \
            --title "$title" --notes-file notes.md --latest --verify-tag
