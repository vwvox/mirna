<!doctype html>
<!-- Mirna's installer window background. Render at 1320x800, then set 144 dpi:
     Chrome --headless=new --window-size=1320,800 --screenshot=out.png dmg-background.html
     sips -s dpiWidth 144 -s dpiHeight 144 out.png --out apps/desktop/src-tauri/assets/dmg-background-mirna.png -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Figtree"; src: url("../../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
html, body { margin: 0; width: 1320px; height: 800px; overflow: hidden; }
body {
  background: radial-gradient(120% 90% at 50% 0%, #fbfaf6 0%, #f5f3ec 70%, #efece2 100%);
  font-family: "Figtree", sans-serif; color: #2f3431; position: relative;
}
.wordmark { position: absolute; top: 74px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
.word { font-family: "Fraunces"; font-size: 92px; line-height: 1; color: #2e4a3b; letter-spacing: -0.015em; font-variation-settings: "opsz" 144; }
.i { position: relative; display: inline-block; }
.dot { position: absolute; top: 0.06em; left: 50%; width: 0.19em; height: 0.19em; transform: translateX(-50%); border-radius: 50%; background: #e3b23c; }
.mist { width: 239px; height: 16px; margin-top: 6px; }
.well { position: absolute; top: 236px; width: 320px; height: 320px; border-radius: 76px;
  background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 0 0 1.5px rgba(169,184,163,0.45), 0 18px 40px -24px rgba(46,74,59,0.35); }
.well.app { left: 194px; } .well.apps { left: 806px; }
.hint { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-size: 25px; line-height: 1.3; font-weight: 600; color: #2e4a3b; letter-spacing: 0.005em; }
.arrow { position: absolute; top: 380px; left: 548px; width: 224px; height: 60px; }
.foot { position: absolute; bottom: 44px; left: 0; right: 0; text-align: center; font-size: 22px; color: #6b706c; }
</style></head>
<body>
  <div class="wordmark">
    <div class="word">m<span class="i">ı<span class="dot"></span></span>rna</div>
    <svg class="mist" viewBox="0 0 250 16" fill="none" stroke-linecap="round" stroke-width="3.2">
      <path d="M4 8 C 30 3, 52 13, 82 8" stroke="#a9b8a3"/>
      <path d="M96 8 C 112 5, 128 11, 148 8" stroke="#b4532f"/>
      <path d="M162 8 C 190 3, 214 13, 246 8" stroke="#a9b8a3"/>
    </svg>
  </div>
  <div class="well app"></div>
  <div class="well apps"></div>
  <div class="hint">Drag Mirna<br>into Applications</div>
  <svg class="arrow" viewBox="0 0 224 60" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 34 C 70 14, 150 14, 206 32" stroke="#a9b8a3" stroke-width="5" stroke-dasharray="2 14"/>
    <path d="M190 18 L 210 33 L 188 44" stroke="#b4532f" stroke-width="5"/>
  </svg>
  <div class="foot">Your recordings and notes stay on this Mac.</div>
</body></html>
